<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>تسجيل الطلاب</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">تسجيل الطلاب</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="hero" data-page-hero style="margin:14px 0 16px;padding:18px 20px;border-radius:22px"><span class="eyebrow" style="color:#f3dfb2">لوحة الإدارة</span><h1 style="margin:4px 0 0;font-size:22px;font-weight:900;color:#fffdf6">تسجيل الطلاب</h1></section>
    <div id="lockNotice" class="notice hidden">المسجد مقفول، ما تقدر تعدّل التسجيل إلا بإذن الآدمن.</div>
    <div id="noMosque" class="notice hidden">ما في مسجد مربوط بحسابك، كلّم الآدمن.</div>

    <section class="card hidden" id="adminCard">
      <h2>الإعدادات</h2>
      <label for="maxGamesInput">الحد الأقصى للألعاب لكل طالب</label>
      <input id="maxGamesInput" type="number" min="1" max="20" dir="ltr">
      <div class="row"><button id="saveLimitBtn" type="button">حفظ الحد</button></div>
      <p id="limitMsg" class="ok"></p>
    </section>

    <section class="card">
      <h2>المسجد</h2>
      <div id="mosqueSelectWrap" class="hidden">
        <label for="mosqueSelect">اختر المسجد</label>
        <select id="mosqueSelect"></select>
      </div>
      <p id="mosqueName" class="item-name"></p>
      <div id="logoBox" class="row" style="align-items:center;margin-top:8px"></div>
      <label for="logoUp" class="item-meta">تغيير شعار المسجد</label>
      <input id="logoUp" type="file" accept="image/*" style="width:100%;min-height:48px">
      <p id="logoMsg" class="item-meta"></p>
      <button id="lockBtn" type="button" class="danger hidden">اعتماد التسجيل وقفل المسجد</button>
      <p id="lockErr" class="err"></p>
      <button id="reqBtn" type="button" class="ghost hidden">طلب فتح التعديل من الآدمن</button>
      <p id="reqMsg" class="item-meta"></p>
      <p id="maxInfo" class="item-meta"></p>
    </section>

    <section class="card">
      <h2>السعة في كل لعبة</h2>
      <div id="capList"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card">
      <h2 id="formTitle">إضافة طالب</h2>
      <form id="studentForm" autocomplete="off" onsubmit="return false;">
        <label for="studentName">اسم الطالب</label>
        <input id="studentName" maxlength="60">

        <label for="teamSelect">الفريق (اختياري)</label>
        <select id="teamSelect" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px"></select>

        <label>الألعاب المسجّل فيها</label>
        <div id="gamesBox"></div>

        <div class="row">
          <button id="saveBtn" type="button">حفظ</button>
          <button id="cancelBtn" type="button" class="ghost hidden">إلغاء التعديل</button>
        </div>
        <p id="formErr" class="err" role="alert"></p>
        <p id="formOk" class="ok"></p>
      </form>
    </section>

    <section class="card">
      <h2>فرق المسجد</h2>
      <label for="teamName">اسم الفريق</label>
      <input id="teamName" maxlength="60" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px">
      <label for="teamSup">اسم مشرف الفريق</label>
      <input id="teamSup" maxlength="60" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px">
      <div class="row"><button id="addTeamBtn" type="button" class="ghost">إضافة فريق</button></div>
      <p id="teamMsg" class="item-meta"></p>
      <div id="teamList" style="margin-top:10px"></div>
    </section>

    <section class="card">
      <h2>الطلاب</h2>
      <div id="list"><p class="empty">جاري التحميل...</p></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="التنقل الإداري">
    <a href="app.html" class="active"><span class="ic">🏠</span>الرئيسية</a>
    <a href="mosques.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="games.html" class=""><span class="ic">🎯</span>الألعاب</a>
    <a href="accounts.html" class=""><span class="ic">👤</span>الحسابات</a>
    <a href="tools.html" class=""><span class="ic">🛠️</span>الأدوات</a>
    <a href="log.html" class=""><span class="ic">🧾</span>السجل</a>
  </nav>

  <script type="module">
    import { auth, db, tf, hasPerm } from "./firebase.js";
    import { compressLogo } from "./logo.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, setDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let me = null;
    let mosqueId = null;
    let mosqueLocked = false;
    let maxGames = 2;
    let games = [];
    let students = [];
    let mosquesMap = {};
    let editingId = null;

    // ---------- الحماية: الآدمن ومشرف المسجد فقط ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;
      if (!p || p.disabled || p.deleted || p.mustChange || !hasPerm(p, "students")) {
        return location.replace("app.html");
      }
      me = { uid: user.uid, ...p };

      const mSnap = await getDocs(query(collection(db, "mosques"), ...tf()));
      mosquesMap = Object.fromEntries(mSnap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));

      if (me.role === "admin") {
        $("adminCard").classList.remove("hidden");
        $("mosqueSelectWrap").classList.remove("hidden");
        const opts = Object.values(mosquesMap).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        const sel = $("mosqueSelect");
        sel.innerHTML = "";
        opts.forEach((m) => sel.appendChild(el("option", { value: m.id, text: m.name || m.id })));
        sel.addEventListener("change", () => selectMosque(sel.value));
        if (opts.length) selectMosque(opts[0].id);
        else $("noMosque").classList.remove("hidden");
      } else {
        if (!me.mosqueId) {
          $("noMosque").classList.remove("hidden");
          return;
        }
        selectMosque(me.mosqueId);
      }
      await loadLimit();
    });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "style") Object.assign(node.style, v);
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    const errText = (e) => (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ، حاول مرة ثانية");

    async function selectMosque(id) {
      mosqueId = id;
      const m = mosquesMap[id] || {};
      mosqueLocked = m.locked === true;
      $("mosqueName").textContent = m.name || id;
      showLogo();
      $("lockNotice").classList.toggle("hidden", !mosqueLocked);
      $("lockBtn").classList.toggle("hidden", mosqueLocked || me.role !== "mosque_supervisor");
      resetForm();
      await loadGames();
      await loadTeams();
      await loadStudents();
      await loadUnlockRequest();
    }


    $("lockBtn").addEventListener("click", async () => {
      $("lockErr").textContent = "";
      if (!confirm("متأكد؟ ما تقدر تعدّل بعدها، إلا بإذن الآدمن.")) return;
      try {
        await updateDoc(doc(db, "mosques", mosqueId), { locked: true, lockedAt: serverTimestamp(), lockedBy: me.uid });
        await logAction("mosque.lock", mosqueId, {});
        mosquesMap[mosqueId] = { ...(mosquesMap[mosqueId] || {}), locked: true };
        await selectMosque(mosqueId);
      } catch (e) {
        $("lockErr").textContent = errText(e);
      }
    });


    async function loadUnlockRequest() {
      $("reqBtn").classList.add("hidden");
      $("reqMsg").textContent = "";
      if (me.role !== "mosque_supervisor" || !mosqueLocked) return;
      const snap = await getDocs(query(
        collection(db, "requests"),
        where("requestedBy", "==", me.uid),
        where("status", "==", "pending")
      ));
      const pending = snap.docs.find((d) => d.data().mosqueId === mosqueId);
      if (pending) {
        $("reqMsg").textContent = "طلبك لفتح التعديل قيد المراجعة عند الآدمن.";
      } else {
        $("reqBtn").classList.remove("hidden");
      }
    }

    $("reqBtn").addEventListener("click", async () => {
      $("reqMsg").textContent = "";
      try {
        await addDoc(collection(db, "requests"), {
          type: "unlock",
          mosqueId,
          mosqueName: mosquesMap[mosqueId]?.name || mosqueId,
          requestedBy: me.uid,
          status: "pending",
          createdAt: serverTimestamp(),
        });
        await logAction("mosque.unlock_request", mosqueId, {});
        await loadUnlockRequest();
      } catch (e) {
        $("reqMsg").textContent = errText(e);
      }
    });


    function showLogo() {
      const m = mosquesMap[mosqueId] || {};
      const box = $("logoBox");
      box.innerHTML = "";
      if (m.logo) box.appendChild(el("img", { src: m.logo, alt: "", style: { width: "64px", height: "64px", borderRadius: "12px", objectFit: "cover" } }));
      else box.appendChild(el("span", { class: "item-meta", text: "ما في شعار بعد" }));
    }

    $("logoUp").addEventListener("change", async () => {
      const f = $("logoUp").files[0];
      if (!f) return;
      $("logoMsg").textContent = "";
      if (mosqueLocked) { $("logoMsg").textContent = "المسجد مقفول"; return; }
      try {
        const data = await compressLogo(f);
        await updateDoc(doc(db, "mosques", mosqueId), { logo: data, logoAt: serverTimestamp() });
        await logAction("mosque.logo", mosqueId, {});
        mosquesMap[mosqueId] = { ...(mosquesMap[mosqueId] || {}), logo: data };
        showLogo();
        $("logoMsg").textContent = "تم تحديث الشعار";
      } catch (e) {
        $("logoMsg").textContent = (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ");
      }
    });


    let teams = [];
    async function loadTeams() {
      if (!mosqueId) return;
      const snap = await getDocs(query(collection(db, "teams"), where("mosqueId", "==", mosqueId), ...tf()));
      teams = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      teams.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      const sel = $("teamSelect");
      const keep = sel.value;
      sel.innerHTML = "";
      sel.appendChild(el("option", { value: "", text: "بدون فريق" }));
      teams.forEach((t) => sel.appendChild(el("option", { value: t.id, text: t.name || t.id })));
      sel.value = keep;
      const box = $("teamList");
      box.innerHTML = "";
      if (!teams.length) box.appendChild(el("p", { class: "item-meta", text: "ما في فرق بعد" }));
      teams.forEach((t) => box.appendChild(el("div", { class: "item" }, [
        el("div", { class: "item-name", text: t.name || "-" }),
        el("div", { class: "item-meta", text: "مشرف الفريق: " + (t.supervisorName || "-") }),
        el("div", { class: "row" }, [
          el("button", { class: "danger", type: "button", text: "حذف الفريق", disabled: mosqueLocked, onclick: () => removeTeam(t) }),
        ]),
      ])));
    }

    $("addTeamBtn").addEventListener("click", async () => {
      $("teamMsg").textContent = "";
      const name = $("teamName").value.trim();
      const supervisorName = $("teamSup").value.trim();
      if (mosqueLocked) return ($("teamMsg").textContent = "المسجد مقفول");
      if (name.length < 2) return ($("teamMsg").textContent = "اسم الفريق لازم يكون حرفين على الأقل");
      if (supervisorName.length < 2) return ($("teamMsg").textContent = "اكتب اسم مشرف الفريق");
      try {
        await addDoc(collection(db, "teams"), { name, supervisorName, mosqueId, isTest: false, createdAt: serverTimestamp(), createdBy: me.uid });
        await logAction("team.create", mosqueId, { name, supervisorName });
        $("teamName").value = "";
        $("teamSup").value = "";
        await loadTeams();
      } catch (e) {
        $("teamMsg").textContent = (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ");
      }
    });

    async function removeTeam(t) {
      if (mosqueLocked) return;
      if (!confirm("حذف الفريق (" + (t.name || "") + ")؟ الطلاب المرتبطين يبقون بدون فريق.")) return;
      try {
        await deleteDoc(doc(db, "teams", t.id));
        await logAction("team.delete", t.id, { name: t.name || "" });
        await loadTeams();
      } catch (e) {
        alert((e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ"));
      }
    }


    async function logAction(action, targetId, details = {}) {
      try {
        await addDoc(collection(db, "auditLog"), { actorUid: me.uid, action, targetId: targetId || null, details, at: serverTimestamp() });
      } catch (e) { /* السجل ما يوقف العملية */ }
    }

    // ---------- الإعدادات ----------
    async function loadLimit() {
      const snap = await getDoc(doc(db, "settings", "studentLimits"));
      maxGames = snap.exists() && snap.data().maxGamesPerStudent ? snap.data().maxGamesPerStudent : 2;
      $("maxInfo").textContent = "الحد الأقصى للألعاب لكل طالب: " + maxGames;
      $("maxGamesInput").value = maxGames;
    }

    $("saveLimitBtn").addEventListener("click", async () => {
      const n = Number($("maxGamesInput").value);
      if (!Number.isInteger(n) || n < 1 || n > 20) {
        $("limitMsg").className = "err";
        $("limitMsg").textContent = "الرقم لازم يكون بين 1 و20";
        return;
      }
      try {
        await setDoc(doc(db, "settings", "studentLimits"), { maxGamesPerStudent: n, updatedAt: serverTimestamp() }, { merge: true });
        maxGames = n;
        $("maxInfo").textContent = "الحد الأقصى للألعاب لكل طالب: " + maxGames;
        $("limitMsg").className = "ok";
        $("limitMsg").textContent = "تم حفظ الحد";
      } catch (e) {
        $("limitMsg").className = "err";
        $("limitMsg").textContent = errText(e);
      }
    });

    // ---------- الألعاب والسعة ----------
    async function loadGames() {
      const snap = await getDocs(query(collection(db, "games"), ...tf()));
      games = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((g) => !g.archived);
      games.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      renderGamesBox();
      renderCapacity();
    }

    function countFor(gameId, excludeId = null) {
      return students.filter((s) => s.id !== excludeId && (s.games || []).includes(gameId)).length;
    }

    function renderCapacity() {
      const list = $("capList");
      list.innerHTML = "";
      if (!games.length) {
        list.appendChild(el("p", { class: "empty", text: "ما في ألعاب مفعّلة بعد" }));
        return;
      }
      games.forEach((g) => {
        list.appendChild(el("div", { class: "cap" }, [
          el("span", { text: g.name || "-" }),
          el("b", { text: countFor(g.id) + " من " + (g.maxPlayers ?? "-") }),
        ]));
      });
    }

    function renderGamesBox(selected = []) {
      const box = $("gamesBox");
      box.innerHTML = "";
      if (!games.length) {
        box.appendChild(el("p", { class: "empty", text: "ما في ألعاب مفعّلة" }));
        return;
      }
      games.forEach((g) => {
        const cnt = countFor(g.id, editingId);
        const full = cnt >= (g.maxPlayers ?? 0) && !selected.includes(g.id);
        const cb = el("input", { type: "checkbox", value: g.id, checked: selected.includes(g.id), disabled: full || mosqueLocked });
        box.appendChild(el("label", { class: "check" + (full ? " full" : ""), style: { margin: "8px 0 0" } }, [
          cb,
          el("span", { text: (g.name || "-") + " (" + cnt + " من " + (g.maxPlayers ?? "-") + ")" + (full ? " - مكتملة" : "") }),
        ]));
      });
    }

    // ---------- الطلاب ----------
    async function loadStudents() {
      if (!mosqueId) return;
      const snap = await getDocs(query(
        collection(db, "players"),
        where("mosqueId", "==", mosqueId),
        ...tf()
      ));
      students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      students.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      renderList();
      renderCapacity();
      renderGamesBox(currentSelection());
    }

    function gameNameOf(id) {
      return (games.find((g) => g.id === id) || {}).name || id;
    }

    function renderList() {
      const list = $("list");
      list.innerHTML = "";
      if (!students.length) {
        list.appendChild(el("p", { class: "empty", text: "ما في طلاب مسجّلين بعد" }));
        return;
      }
      students.forEach((s) => {
        list.appendChild(el("div", { class: "item" }, [
          el("div", { class: "item-name", text: s.name || "-" }),
          el("div", { class: "item-meta", text: ((teams.find((t) => t.id === s.teamId) || {}).name ? "الفريق: " + teams.find((t) => t.id === s.teamId).name + " · " : "") + ((s.games || []).map(gameNameOf).join("، ") || "بدون ألعاب") }),
          el("div", { class: "row" }, [
            el("button", { class: "ghost", type: "button", text: "تعديل", disabled: mosqueLocked, onclick: () => startEdit(s) }),
            el("button", { class: "danger", type: "button", text: "حذف", disabled: mosqueLocked, onclick: () => removeStudent(s) }),
          ]),
        ]));
      });
    }

    function currentSelection() {
      return Array.from(document.querySelectorAll("#gamesBox input:checked")).map((c) => c.value);
    }

    function resetForm() {
      editingId = null;
      $("studentName").value = "";
      $("formTitle").textContent = "إضافة طالب";
      $("saveBtn").textContent = "حفظ";
      $("cancelBtn").classList.add("hidden");
      $("formErr").textContent = "";
      $("formOk").textContent = "";
      $("saveBtn").disabled = mosqueLocked;
      renderGamesBox([]);
    }
    $("cancelBtn").addEventListener("click", resetForm);

    function startEdit(s) {
      editingId = s.id;
      $("studentName").value = s.name || "";
      $("formTitle").textContent = "تعديل: " + (s.name || "");
      $("saveBtn").textContent = "حفظ التعديل";
      $("cancelBtn").classList.remove("hidden");
      $("formErr").textContent = "";
      $("formOk").textContent = "";
      renderGamesBox(s.games || []);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("saveBtn").addEventListener("click", async () => {
      const btn = $("saveBtn");
      $("formErr").textContent = "";
      $("formOk").textContent = "";

      if (mosqueLocked) return ($("formErr").textContent = "المسجد مقفول");
      const name = $("studentName").value.trim();
      if (name.length < 2 || name.length > 60) return ($("formErr").textContent = "اسم الطالب لازم يكون بين 2 و60 حرف");

      const selected = currentSelection();
      if (selected.length > maxGames) {
        return ($("formErr").textContent = "الحد الأقصى للألعاب لكل طالب " + maxGames + "، اختر أقل");
      }
      for (const gid of selected) {
        const g = games.find((x) => x.id === gid) || {};
        if (countFor(gid, editingId) >= (g.maxPlayers ?? 0)) {
          return ($("formErr").textContent = "لعبة (" + (g.name || gid) + ") مكتملة");
        }
      }

      btn.disabled = true;
      try {
        if (editingId) {
          await updateDoc(doc(db, "players", editingId), { name, games: selected, teamId: $("teamSelect").value || null, updatedAt: serverTimestamp() });
          $("formOk").textContent = "تم حفظ التعديل";
        } else {
          await addDoc(collection(db, "players"), {
            name, games: selected, teamId: $("teamSelect").value || null, mosqueId, isTest: false,
            createdAt: serverTimestamp(), createdBy: me.uid,
          });
          $("formOk").textContent = "تم تسجيل الطالب";
        }
        await logAction(editingId ? "player.update" : "player.create", editingId || "", { name });
        resetForm();
        $("formOk").textContent = editingId ? "" : $("formOk").textContent;
        await loadStudents();
      } catch (e) {
        $("formErr").textContent = errText(e);
      } finally {
        btn.disabled = mosqueLocked;
      }
    });

    async function removeStudent(s) {
      if (mosqueLocked) return;
      if (!confirm("حذف الطالب (" + (s.name || "") + ")؟")) return;
      try {
        await deleteDoc(doc(db, "players", s.id));
        await logAction("player.delete", s.id, { name: s.name || "" });
        await loadStudents();
      } catch (e) {
        alert(errText(e));
      }
    }
  </script>
  <script type="module" src="maintenance.js"></script>
  <script>(function(){var p=new URLSearchParams(location.search).get("preview");if(!p)return;var d=document.createElement("div");d.setAttribute("style","position:sticky;top:0;z-index:99;background:#D4A937;color:#0F172A;padding:8px 12px;font-weight:700;text-align:center;font-family:Tajawal,system-ui,sans-serif");d.textContent="أنت تعاين كـ: "+({visitor:"زائر",supervisor:"مشرف مسجد",organizer:"منظم"}[p]||p)+" · الآدمن عنده كل الصلاحيات حتى بالمعاينة";document.body.prepend(d);})();</script>
</body>
</html>
