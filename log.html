<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>سجل العمليات</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">سجل العمليات</div><a class="btn ghost" href="app.html">الرئيسية</a></div>
  <main class="wrap" id="list"><p class="empty">جاري التحميل...</p></main>

  <nav class="tabbar">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="mosques.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="games.html" class=""><span class="ic">🎯</span>الألعاب</a>
    <a href="accounts.html" class=""><span class="ic">👤</span>الحسابات</a>
    <a href="tools.html" class=""><span class="ic">🛠️</span>الأدوات</a>
    <a href="log.html" class="active"><span class="ic">🧾</span>السجل</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => { if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node[k] = v; });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;
      if (!p || p.disabled || p.deleted || !["admin", "supervisor"].includes(p.role)) return location.replace("app.html");

      const logs = await getDocs(query(collection(db, "auditLog"), orderBy("at", "desc"), limit(100)));
      const list = $("list");
      list.innerHTML = "";
      if (logs.empty) { list.appendChild(el("p", { class: "empty", text: "ما في عمليات بعد" })); return; }
      logs.docs.forEach((d) => {
        const r = d.data();
        const when = r.at?.toDate ? r.at.toDate().toLocaleString("ar", { dateStyle: "medium", timeStyle: "short" }) : "";
        const det = r.details && Object.keys(r.details).length ? JSON.stringify(r.details) : "";
        list.appendChild(el("div", { class: "card" }, [
          el("div", { class: "act", text: r.action || "-" }),
          el("div", { class: "meta", text: when + (r.targetId ? " · الهدف: " + r.targetId : "") }),
          det ? el("div", { class: "det", text: det }) : el("span"),
        ]));
      });
    });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
