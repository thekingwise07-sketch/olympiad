<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>إدارة المساجد</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="topbar"><div class="brand">إدارة المساجد</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="hero" data-page-hero style="margin:14px 0 16px;padding:18px 20px;border-radius:22px"><span class="eyebrow" style="color:#f3dfb2">لوحة الإدارة</span><h1 style="margin:4px 0 0;font-size:22px;font-weight:900;color:#fffdf6">إدارة المساجد</h1></section>
    <section class="card">
      <h2>طلبات فتح التعديل</h2>
      <div id="requestsList"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card">
      <h2 id="formTitle">إضافة مسجد</h2>
      <form id="mosqueForm" autocomplete="off" onsubmit="return false;">
        <label for="name">اسم المسجد</label>
        <input id="name" required maxlength="60">

        <label for="color">لون المسجد</label>
        <input id="color" type="color" value="#1E3A8A">

        <label for="logoFile">شعار المسجد (اختياري)</label>
        <input id="logoFile" type="file" accept="image/*">

        <div class="row">
          <button id="saveBtn" type="submit">حفظ</button>
          <button id="cancelBtn" type="button" class="ghost hidden">إلغاء التعديل</button>
        </div>
        <p id="formErr" class="err" role="alert"></p>
      </form>
    </section>

    <section class="card">
      <h2>المساجد</h2>
      <div id="list"><p class="empty">جاري التحميل...</p></div>
    </section>
  </main>

  <script>
    setTimeout(function () {
      var st = document.getElementById("status");
      if (st && st.textContent.indexOf("اشتغل") === -1) {
        st.textContent = "الكود ما اشتغل، صوّر هالشاشة وأرسلها";
        st.style.background = "#FEE2E2";
        st.style.color = "#B91C1C";
      }
    }, 5000);
    window.addEventListener("error", function (e) {
      var box = document.getElementById("formErr");
      if (box) box.textContent = "خطأ برمجي: " + (e.message || "غير معروف");
    });
    window.addEventListener("unhandledrejection", function (e) {
      var box = document.getElementById("formErr");
      if (box) box.textContent = "خطأ: " + (e.reason && (e.reason.code || e.reason.message) || "غير معروف");
    });
  </script>
  <nav class="tabbar" aria-label="التنقل الإداري">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="mosques.html" class="active"><span class="ic">🕌</span>المساجد</a>
    <a href="games.html" class=""><span class="ic">🎯</span>الألعاب</a>
    <a href="accounts.html" class=""><span class="ic">👤</span>الحسابات</a>
    <a href="tools.html" class=""><span class="ic">🛠️</span>الأدوات</a>
    <a href="log.html" class=""><span class="ic">🧾</span>السجل</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { compressLogo } from "./logo.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp, where,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let me = null;
    let editingId = null;
    let pendingLogo = null;
    $("logoFile").addEventListener("change", async () => {
      const f = $("logoFile").files[0];
      if (!f) { pendingLogo = null; return; }
      try { pendingLogo = await compressLogo(f); } catch (e) { alert(e.message); pendingLogo = null; }
    });

    // ---------- حماية الصفحة: للآدمن فقط ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;
      if (!p || p.role !== "admin" || p.disabled || p.deleted || p.mustChange) {
        return location.replace("app.html");
      }
      me = { uid: user.uid, ...p };
      await loadMosques();
      await loadRequests();
    });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "style") Object.assign(node.style, v);
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    const errText = (e) => (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ، حاول مرة ثانية");

    async function audit(action, targetId, details = {}) {
      await addDoc(collection(db, "auditLog"), {
        actorUid: me.uid, action, targetId: targetId || null, details, at: serverTimestamp(),
      });
    }

    // ---------- قائمة المساجد ----------
    async function loadMosques() {
      const snap = await getDocs(query(collection(db, "mosques"), orderBy("name")));
      const list = $("list");
      list.innerHTML = "";
      if (snap.empty) {
        list.appendChild(el("p", { class: "empty", text: "ما في مساجد بعد" }));
        return;
      }
      snap.docs.forEach((d) => list.appendChild(renderMosque(d.id, d.data())));
    }

    function renderMosque(id, m) {
      return el("div", { class: "item" }, [
        m.logo ? el("img", { src: m.logo, alt: "", style: { width: "40px", height: "40px", borderRadius: "10px", objectFit: "cover", flex: "0 0 40px" } }) : el("div", { class: "swatch", style: { background: m.color || "#1E3A8A" } }),
        el("div", { class: "item-name", text: m.name || "-" }),
        el("div", { class: "item-actions" }, [
          el("button", { class: "ghost", type: "button", text: "تعديل", onclick: () => startEdit(id, m) }),
          el("button", { class: "danger", type: "button", text: "حذف", onclick: () => removeMosque(id, m) }),
          ...(m.locked === true ? [el("button", { class: "ghost", type: "button", text: "فتح القفل", onclick: () => unlockMosque(id, m) })] : []),
        ]),
        ...(m.locked === true ? [el("div", { class: "item-name", style: { color: "#B91C1C", fontSize: "14px" }, text: "مقفول: التسجيل معتمد" })] : []),
      ]);
    }


    async function unlockMosque(id, m) {
      if (!confirm("فتح القفل لمسجد (" + (m.name || "") + ")؟ المشرف يقدر يعدّل التسجيل بعدها.")) return;
      try {
        await updateDoc(doc(db, "mosques", id), { locked: false, unlockedAt: serverTimestamp() });
        await audit("mosque.unlock", id, { name: m.name || "" });
        await loadMosques();
      } catch (e) {
        alert(errText(e));
      }
    }


    // ---------- طلبات فتح التعديل ----------
    async function loadRequests() {
      const snap = await getDocs(query(collection(db, "requests"), where("status", "==", "pending")));
      const list = document.getElementById("requestsList");
      list.innerHTML = "";
      if (snap.empty) {
        list.appendChild(el("p", { class: "empty", text: "ما في طلبات معلّقة" }));
        return;
      }
      snap.docs.forEach((d) => {
        const r = d.data();
        list.appendChild(el("div", { class: "item" }, [
          el("div", { class: "item-name", text: r.mosqueName || r.mosqueId || "-" }),
          el("div", { class: "item-actions" }, [
            el("button", { class: "ghost", type: "button", text: "فتح القفل", onclick: () => approveRequest(d.id, r) }),
            el("button", { class: "danger", type: "button", text: "رفض", onclick: () => rejectRequest(d.id, r) }),
          ]),
        ]));
      });
    }

    async function approveRequest(reqId, r) {
      if (!confirm("فتح التعديل لمسجد (" + (r.mosqueName || "") + ")؟")) return;
      try {
        await updateDoc(doc(db, "mosques", r.mosqueId), { locked: false, unlockedAt: serverTimestamp() });
        await updateDoc(doc(db, "requests", reqId), { status: "approved", decidedAt: serverTimestamp(), decidedBy: me.uid });
        await audit("mosque.unlock_approved", r.mosqueId, { requestId: reqId });
        await loadMosques();
        await loadRequests();
      } catch (e) {
        alert(errText(e));
      }
    }

    async function rejectRequest(reqId, r) {
      if (!confirm("رفض طلب فتح التعديل لمسجد (" + (r.mosqueName || "") + ")؟")) return;
      try {
        await updateDoc(doc(db, "requests", reqId), { status: "rejected", decidedAt: serverTimestamp(), decidedBy: me.uid });
        await loadRequests();
      } catch (e) {
        alert(errText(e));
      }
    }

    // ---------- الفورم ----------
    function resetForm() {
      editingId = null;
      $("mosqueForm").reset();
      $("color").value = "#1E3A8A";
      $("formTitle").textContent = "إضافة مسجد";
      $("saveBtn").textContent = "حفظ";
      $("cancelBtn").classList.add("hidden");
      $("formErr").textContent = "";
    }
    $("cancelBtn").addEventListener("click", resetForm);

    function startEdit(id, m) {
      editingId = id;
      $("name").value = m.name || "";
      $("color").value = m.color || "#1E3A8A";
      $("formTitle").textContent = "تعديل: " + (m.name || "");
      $("saveBtn").textContent = "حفظ التعديل";
      $("cancelBtn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("mosqueForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const btn = $("saveBtn");
      btn.disabled = true;
      $("formErr").textContent = "";

      const name = $("name").value.trim();
      const color = $("color").value;
      if (name.length < 2 || name.length > 60) {
        $("formErr").textContent = "اسم المسجد لازم يكون بين 2 و60 حرف";
        btn.disabled = false;
        return;
      }

      try {
        if (editingId) {
          await updateDoc(doc(db, "mosques", editingId), { name, color, ...(pendingLogo ? { logo: pendingLogo } : {}), updatedAt: serverTimestamp() });
          await audit("mosque.update", editingId, { name });
        } else {
          const ref = await addDoc(collection(db, "mosques"), {
            name, color, ...(pendingLogo ? { logo: pendingLogo } : {}), locked: false, isTest: false,
            createdAt: serverTimestamp(), createdBy: me.uid,
          });
          await audit("mosque.create", ref.id, { name });
        }
        resetForm();
        await loadMosques();
      } catch (e) {
        $("formErr").textContent = errText(e);
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- الحذف ----------
    async function removeMosque(id, m) {
      if (!confirm("حذف مسجد (" + (m.name || "") + ")؟ ما يرجع بعدها.")) return;
      try {
        await deleteDoc(doc(db, "mosques", id));
        await audit("mosque.delete", id, { name: m.name || "" });
        await loadMosques();
      } catch (e) {
        alert(errText(e));
      }
    }
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
