<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>القوانين</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">القوانين</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="card" id="viewCard">
      <div id="view"><p class="body">جاري التحميل...</p></div>
    </section>

    <section class="card hidden" id="adminCard">
      <h2>تعديل القوانين (للآدمن)</h2>
      <label for="sectionSelect">اختر القسم</label>
      <select id="sectionSelect" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px"></select>
      <label for="ruleBody">النص</label>
      <textarea id="ruleBody"></textarea>
      <button id="saveRuleBtn" type="button">حفظ القسم</button>
      <p id="ruleMsg" class="msg"></p>
    </section>
  </main>

  <nav class="tabbar">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="matches-public.html" class=""><span class="ic">⚽</span>المباريات</a>
    <a href="ranking.html" class=""><span class="ic">🏆</span>الترتيب</a>
    <a href="mosques-public.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="news.html" class=""><span class="ic">📰</span>الأخبار</a>
    <a href="rules.html" class="active"><span class="ic">📜</span>القوانين</a>
  </nav>
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    // أقسام القوانين (معرّف الوثيقة + العنوان)
    const SECTIONS = [
      { id: "general", title: "القوانين العامة ومبادئ اللعب والأخلاق" },
      { id: "football", title: "قوانين كرة القدم" },
      { id: "volleyball", title: "قوانين الطائرة" },
      { id: "chess", title: "قوانين الشطرنج" },
      { id: "sprint", title: "قوانين الضاحية" },
    ];

    let isAdmin = false;
    let texts = {};

    onAuthStateChanged(auth, async (user) => {
      isAdmin = false;
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const p = snap.exists() ? snap.data() : null;
        isAdmin = !!p && p.role === "admin" && !p.disabled && !p.deleted;
      }
      $("adminCard").classList.toggle("hidden", !isAdmin);
      await loadRules();
    });

    async function loadRules() {
      const snap = await getDocs(collection(db, "rules"));
      texts = Object.fromEntries(snap.docs.map((d) => [d.id, d.data().body || ""]));
      renderView();
      renderAdmin();
    }

    function renderView() {
      const view = $("view");
      view.innerHTML = "";
      SECTIONS.forEach((s, i) => {
        const body = texts[s.id];
        const block = document.createElement("div");
        const title = document.createElement("div");
        title.className = "sec-title";
        title.textContent = s.title;
        const text = document.createElement("div");
        text.className = "body";
        text.textContent = body || "لم تُكتب بعد.";
        block.appendChild(title);
        block.appendChild(text);
        view.appendChild(block);
        if (i < SECTIONS.length - 1) {
          const hr = document.createElement("hr");
          hr.className = "sep";
          view.appendChild(hr);
        }
      });
    }

    function renderAdmin() {
      const sel = $("sectionSelect");
      const keep = sel.value;
      sel.innerHTML = "";
      SECTIONS.forEach((s) => {
        const o = document.createElement("option");
        o.value = s.id;
        o.textContent = s.title;
        sel.appendChild(o);
      });
      if (keep) sel.value = keep;
      $("ruleBody").value = texts[sel.value] || "";
    }

    $("sectionSelect").addEventListener("change", () => {
      $("ruleBody").value = texts[$("sectionSelect").value] || "";
      $("ruleMsg").textContent = "";
    });

    $("saveRuleBtn").addEventListener("click", async () => {
      const id = $("sectionSelect").value;
      const body = $("ruleBody").value.trim();
      $("ruleMsg").className = "msg";
      if (body.length < 2) {
        $("ruleMsg").classList.add("err");
        $("ruleMsg").textContent = "اكتب نص القانون";
        return;
      }
      $("saveRuleBtn").disabled = true;
      try {
        await setDoc(doc(db, "rules", id), { body, updatedAt: serverTimestamp() }, { merge: true });
        texts[id] = body;
        renderView();
        $("ruleMsg").classList.add("ok");
        $("ruleMsg").textContent = "تم حفظ القسم";
      } catch (e) {
        $("ruleMsg").classList.add("err");
        $("ruleMsg").textContent = (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ");
      } finally {
        $("saveRuleBtn").disabled = false;
      }
    });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
