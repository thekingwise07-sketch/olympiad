<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>المباريات</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">المباريات</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="hero" data-page-hero style="margin:14px 0 16px;padding:18px 20px;border-radius:22px"><span class="eyebrow" style="color:#f3dfb2">لوحة الإدارة</span><h1 style="margin:4px 0 0;font-size:22px;font-weight:900;color:#fffdf6">المباريات</h1></section>
    <div id="noGame" class="notice hidden">ما في لعبة مربوطة بحسابك، كلّم الآدمن.</div>

    <section class="card">
      <h2 id="formTitle">تسجيل مباراة</h2>
      <form id="matchForm" autocomplete="off" onsubmit="return false;">
        <label for="gameSelect">اللعبة</label>
        <select id="gameSelect"></select>

        <label for="matchDate">تاريخ المباراة</label>
        <input id="matchDate" type="date" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px">
        <label for="matchTime">وقت المباراة</label>
        <input id="matchTime" type="time" style="width:100%;min-height:48px;padding:10px 14px;font:inherit;font-size:16px;border:1.5px solid #CBD5E1;border-radius:12px">

        <label for="mosqueA">الفريق الأول (المسجد)</label>
        <select id="mosqueA"></select>

        <label for="mosqueB">الفريق الثاني (المسجد)</label>
        <select id="mosqueB"></select>

        <label>النتيجة</label>
        <div class="scores">
          <input id="scoreA" type="number" min="0" max="99" value="0" dir="ltr">
          <span>-</span>
          <input id="scoreB" type="number" min="0" max="99" value="0" dir="ltr">
        </div>

        <div class="row">
          <button id="draftBtn" type="button" class="ghost">حفظ كمسودة</button>
          <button id="finalBtn" type="button">اعتماد نهائي</button>
          <button id="cancelBtn" type="button" class="ghost hidden">إلغاء التعديل</button>
        </div>
        <p id="formErr" class="err" role="alert"></p>
      </form>
    </section>

    <section class="card">
      <h2>المباريات</h2>
      <div id="list"><p class="empty">جاري التحميل...</p></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="التنقل الإداري">
    <a href="app.html" class="active"><span class="ic">🏠</span>الرئيسية</a>
    <a href="mosques.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="games.html" class=""><span class="ic">🎯</span>الألعاب</a>
    <a href="accounts.html" class=""><span class="ic">👤</span>الحسابات</a>
    <a href="tools.html" class=""><span class="ic">🛠️</span>الأدوات</a>
    <a href="log.html" class=""><span class="ic">🧾</span>السجل</a>
  </nav>

  <script type="module">
    import { auth, db, tf, hasPerm } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let me = null;
    let games = [];
    let mosquesMap = {};
    let matches = [];
    let editingId = null;
    let editingOwner = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;
      if (!p || p.disabled || p.deleted || p.mustChange || !hasPerm(p, "matches")) {
        return location.replace("app.html");
      }
      me = { uid: user.uid, ...p };

      const gSnap = await getDocs(query(collection(db, "games"), ...tf()));
      games = gSnap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((g) => !g.archived);
      if (me.role === "organizer") games = games.filter((g) => g.id === me.gameId);

      const mSnap = await getDocs(query(collection(db, "mosques"), ...tf()));
      mosquesMap = Object.fromEntries(mSnap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));

      if (!games.length) {
        $("noGame").classList.remove("hidden");
        $("list").innerHTML = "";
        $("list").appendChild(el("p", { class: "empty", text: "ما في لعبة متاحة" }));
        return;
      }
      fillSelects();
      await loadMatches();
    });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    const errText = (e) => (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ، حاول مرة ثانية");
    const mosqueName = (id) => (mosquesMap[id] || {}).name || id || "-";
    const gameName = (id) => (games.find((g) => g.id === id) || {}).name || "-";

    function fillSelects() {
      const gs = $("gameSelect");
      gs.innerHTML = "";
      games.forEach((g) => gs.appendChild(el("option", { value: g.id, text: g.name || g.id })));
      gs.disabled = me.role === "organizer";

      const mosqueOptions = Object.values(mosquesMap).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      ["mosqueA", "mosqueB"].forEach((sid) => {
        const s = $(sid);
        s.innerHTML = "";
        mosqueOptions.forEach((m) => s.appendChild(el("option", { value: m.id, text: m.name || m.id })));
      });
      if (mosqueOptions.length > 1) $("mosqueB").selectedIndex = 1;
      const syncSprint = () => {
        const isSprint = (games.find((g) => g.id === gs.value) || {}).type === "sprint";
        ["mosqueA", "mosqueB"].forEach((sid) => {
          $(sid).classList.toggle("hidden", isSprint);
          $(sid).previousElementSibling.classList.toggle("hidden", isSprint);
        });
      };
      gs.onchange = syncSprint;
      syncSprint();
    }

    // ---------- قائمة المباريات ----------
    async function loadMatches() {
      const snap = await getDocs(query(collection(db, "matches"), ...tf()));
      matches = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (me.role === "organizer") matches = matches.filter((m) => m.gameId === me.gameId);
      renderMatches();
    }

    function renderMatches() {
      const list = $("list");
      list.innerHTML = "";
      if (!matches.length) {
        list.appendChild(el("p", { class: "empty", text: "ما في مباريات مسجّلة بعد" }));
        return;
      }
      matches.forEach((m) => {
        const final = m.status === "final";
        const canEdit = me.role === "admin" || (!final && m.organizerUid === me.uid);
        const canDelete = me.role === "admin" || (!final && m.organizerUid === me.uid);
        list.appendChild(el("div", { class: "item" }, [
          el("div", { class: "item-head" }, [
            el("span", { class: "badge" + (final ? " final" : ""), text: final ? "نهائية" : "مسودة" }),
            el("span", { class: "score", text: (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0) }),
          ]),
          el("div", { class: "teams", text: m.mosqueA ? mosqueName(m.mosqueA) + " ضد " + mosqueName(m.mosqueB) : "سباق الضاحية" }),
          el("div", { class: "meta", text: gameName(m.gameId) + (m.matchDate ? " · " + m.matchDate + " " + (m.matchTime || "") : "") }),
          el("div", { class: "row" }, [
            ...(["football", "volleyball", "sprint"].includes(((games.find((g) => g.id === m.gameId)) || {}).type) ? [el("button", { class: "ghost", type: "button", text: "تفاصيل المباراة", onclick: () => { location.href = "match.html?id=" + m.id; } })] : []),
            ...(canEdit ? [el("button", { class: "ghost", type: "button", text: final ? "تصحيح" : "تعديل", onclick: () => startEdit(m) })] : []),
            ...(canDelete ? [el("button", { class: "danger", type: "button", text: "حذف", onclick: () => removeMatch(m) })] : []),
          ]),
        ]));
      });
    }

    // ---------- الفورم ----------
    function readForm() {
      const gameId = $("gameSelect").value;
      const mosqueA = $("mosqueA").value;
      const mosqueB = $("mosqueB").value;
      const scoreA = Number($("scoreA").value);
      const scoreB = Number($("scoreB").value);
      if (!gameId) throw new Error("اختر اللعبة");
      const dateTime = { matchDate: $("matchDate").value || null, matchTime: $("matchTime").value || null };
      if ((games.find((g) => g.id === gameId) || {}).type === "sprint") {
        return { gameId, mosqueA: "", mosqueB: "", scoreA: 0, scoreB: 0, ...dateTime };
      }
      if (!mosqueA || !mosqueB) throw new Error("اختر الفريقين");
      if (mosqueA === mosqueB) throw new Error("الفريقين لازم يكونوا مسجدين مختلفين");
      for (const v of [scoreA, scoreB]) {
        if (!Number.isInteger(v) || v < 0 || v > 99) throw new Error("النتيجة لازم تكون رقم بين 0 و99");
      }
      return { gameId, mosqueA, mosqueB, scoreA, scoreB, ...dateTime };
    }

    function resetForm() {
      editingId = null;
      editingOwner = null;
      $("formTitle").textContent = "تسجيل مباراة";
      $("scoreA").value = 0;
      $("scoreB").value = 0;
      $("cancelBtn").classList.add("hidden");
      $("formErr").textContent = "";
      $("draftBtn").disabled = false;
      $("finalBtn").disabled = false;
    }
    $("cancelBtn").addEventListener("click", resetForm);

    function startEdit(m) {
      editingId = m.id;
      editingOwner = m.organizerUid;
      $("formTitle").textContent = "تعديل: " + mosqueName(m.mosqueA) + " ضد " + mosqueName(m.mosqueB);
      $("gameSelect").value = m.gameId;
      $("mosqueA").value = m.mosqueA;
      $("mosqueB").value = m.mosqueB;
      $("scoreA").value = m.scoreA ?? 0;
      $("scoreB").value = m.scoreB ?? 0;
      $("cancelBtn").classList.remove("hidden");
      $("formErr").textContent = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function save(status) {
      $("formErr").textContent = "";
      let data;
      try { data = readForm(); } catch (e) { return ($("formErr").textContent = e.message); }

      const wasFinal = editingId && matches.find((m) => m.id === editingId)?.status === "final";
      if (status === "final" && !confirm("اعتماد النتيجة نهائياً؟ بعدها ما تتعدل إلا من الآدمن.")) return;
      if (wasFinal && me.role === "admin" && !confirm("تصحيح نتيجة نهائية؟ هذا التغيير ينكتب بالسجل.")) return;

      $("draftBtn").disabled = true;
      $("finalBtn").disabled = true;
      try {
        if (editingId) {
          await updateDoc(doc(db, "matches", editingId), { ...data, status, isTest: false, updatedAt: serverTimestamp() });
          if (me.role === "admin") await audit(wasFinal ? "match.correct" : "match.update", editingId, { status, ...data });
        } else {
          await addDoc(collection(db, "matches"), {
            ...data, status, isTest: false, organizerUid: me.uid,
            createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
          });
        }
        resetForm();
        await loadMatches();
      } catch (e) {
        $("formErr").textContent = errText(e);
      } finally {
        $("draftBtn").disabled = false;
        $("finalBtn").disabled = false;
      }
    }

    $("draftBtn").addEventListener("click", () => save("draft"));
    $("finalBtn").addEventListener("click", () => save("final"));

    async function removeMatch(m) {
      if (!confirm("حذف هذه المباراة؟")) return;
      try {
        await deleteDoc(doc(db, "matches", m.id));
        await loadMatches();
      } catch (e) {
        alert(errText(e));
      }
    }

    async function audit(action, targetId, details = {}) {
      await addDoc(collection(db, "auditLog"), {
        actorUid: me.uid, action, targetId: targetId || null, details, at: serverTimestamp(),
      });
    }
  </script>
  <script type="module" src="maintenance.js"></script>
  <script>(function(){var p=new URLSearchParams(location.search).get("preview");if(!p)return;var d=document.createElement("div");d.setAttribute("style","position:sticky;top:0;z-index:99;background:#D4A937;color:#0F172A;padding:8px 12px;font-weight:700;text-align:center;font-family:Tajawal,system-ui,sans-serif");d.textContent="أنت تعاين كـ: "+({visitor:"زائر",supervisor:"مشرف مسجد",organizer:"منظم"}[p]||p)+" · الآدمن عنده كل الصلاحيات حتى بالمعاينة";document.body.prepend(d);})();</script>
</body>
</html>
