<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>الترتيب</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">الترتيب</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="card">
      <h2>لوحة سباق المساجد</h2>
      <label for="gameFilter">عرض حسب اللعبة</label>
      <select id="gameFilter"><option value="">كل الألعاب</option></select>
      <div id="board" style="margin-top:8px"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card hidden" id="pointsCard">
      <h2>نقاط الألعاب (للآدمن)</h2>
      <div class="pts-grid"><div>اللعبة</div><div>فوز</div><div>تعادل</div></div>
      <div id="pointsInputs"></div>
      <label>نقاط الضاحية: المراكز الأربعة الأولى (والباقي 1)</label>
      <div class="pts-grid" style="grid-template-columns:repeat(4,1fr)">
        <input id="sp1" type="number" min="0" max="99" dir="ltr">
        <input id="sp2" type="number" min="0" max="99" dir="ltr">
        <input id="sp3" type="number" min="0" max="99" dir="ltr">
        <input id="sp4" type="number" min="0" max="99" dir="ltr">
      </div>
      <button id="savePointsBtn" type="button">حفظ النقاط</button>
      <p id="pointsMsg" class="msg"></p>
    </section>
  </main>

  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="matches-public.html" class=""><span class="ic">⚽</span>المباريات</a>
    <a href="ranking.html" class="active"><span class="ic">🏆</span>الترتيب</a>
    <a href="mosques-public.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="news.html" class=""><span class="ic">📰</span>الأخبار</a>
  </nav>
  <script type="module">
    import { auth, db, tf } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, setDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const TYPE_LABELS = { football: "كرة القدم", volleyball: "الطائرة", chess: "الشطرنج", sprint: "الضاحية" };
    const DEFAULT_POINTS = {
      football: { win: 3, draw: 1, loss: 0 },
      volleyball: { win: 3, draw: 1, loss: 0 },
      chess: { win: 3, draw: 1, loss: 0 },
      sprintPlaces: [10, 7, 5, 3],
    };

    let games = {};
    let mosques = {};
    let finals = [];
    let points = DEFAULT_POINTS;
    let isAdmin = false;

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else if (k === "style") Object.assign(node.style, v);
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    onAuthStateChanged(auth, async (user) => {
      isAdmin = false;
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const p = snap.exists() ? snap.data() : null;
        isAdmin = !!p && p.role === "admin" && !p.disabled && !p.deleted;
      }
      $("pointsCard").classList.toggle("hidden", !isAdmin);
      await loadAll();
    });

    async function loadAll() {
      const [gSnap, mSnap, sSnap, mtSnap] = await Promise.all([
        getDocs(query(collection(db, "games"), ...tf())),
        getDocs(query(collection(db, "mosques"), ...tf())),
        getDoc(doc(db, "settings", "points")),
        getDocs(query(collection(db, "matches"), ...tf(), where("status", "==", "final"))),
      ]);
      games = Object.fromEntries(gSnap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      mosques = Object.fromEntries(mSnap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      const saved = sSnap.exists() ? sSnap.data() : {};
      points = { ...DEFAULT_POINTS, ...saved };
      finals = mtSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

      const sel = $("gameFilter");
      const current = sel.value;
      sel.innerHTML = "";
      sel.appendChild(el("option", { value: "", text: "كل الألعاب" }));
      Object.values(games).filter((g) => !g.archived).forEach((g) => sel.appendChild(el("option", { value: g.id, text: g.name || g.id })));
      sel.value = current;

      renderBoard();
      if (isAdmin) renderPointsForm();
    }

    $("gameFilter").addEventListener("change", renderBoard);

    // ---------- الحساب: مباريات (فوز/تعادل/خسارة) + الضاحية (حسب المراكز) ----------
    function computeStandings(gameFilter) {
      const table = {};
      const ensure = (id) => (table[id] ||= { id, pts: 0, win: 0, draw: 0, loss: 0, gd: 0 });
      const places = points.sprintPlaces || DEFAULT_POINTS.sprintPlaces;

      finals.forEach((m) => {
        if (gameFilter && m.gameId !== gameFilter) return;
        const game = games[m.gameId];
        if (!game) return;

        if (game.type === "sprint") {
          (m.details?.ranking || []).forEach((entry, i) => {
            if (!entry.mosqueId) return;
            const t = ensure(entry.mosqueId);
            t.pts += places[i] ?? 1;
          });
          return;
        }

        if (!m.mosqueA || !m.mosqueB) return;
        const cfg = points[game.type] || DEFAULT_POINTS[game.type] || { win: 0, draw: 0, loss: 0 };
        const a = ensure(m.mosqueA);
        const b = ensure(m.mosqueB);
        if (m.scoreA > m.scoreB) { a.pts += cfg.win; a.win++; b.pts += cfg.loss; b.loss++; }
        else if (m.scoreA < m.scoreB) { b.pts += cfg.win; b.win++; a.pts += cfg.loss; a.loss++; }
        else { a.pts += cfg.draw; a.draw++; b.pts += cfg.draw; b.draw++; }
        a.gd += (m.scoreA || 0) - (m.scoreB || 0);
        b.gd += (m.scoreB || 0) - (m.scoreA || 0);
      });

      return Object.values(table).sort((x, y) => y.pts - x.pts || y.win - x.win || y.gd - x.gd);
    }

    // ---------- الأسهم: مقارنة بآخر عرض على هالجهاز ----------
    function snapKey() { return "rankSnap_" + ($("gameFilter").value || "all"); }

    function renderBoard() {
      const board = $("board");
      board.innerHTML = "";
      const rows = computeStandings($("gameFilter").value);
      if (!rows.length) {
        board.appendChild(el("p", { class: "empty", text: "ما في نتائج نهائية بعد" }));
        return;
      }

      let prev = {};
      try { prev = JSON.parse(localStorage.getItem(snapKey()) || "{}"); } catch (e) { prev = {}; }
      const prevRanks = prev.ranks || {};
      const prevPts = prev.pts || {};

      const max = Math.max(1, ...rows.map((r) => r.pts));
      rows.forEach((r, i) => {
        const m = mosques[r.id] || {};
        const color = m.color || "#1E3A8A";
        const bar = el("div", { class: "bar", style: { background: color, width: "0%" } });
        const ptsEl = el("div", { class: "pts", text: String(prevPts[r.id] ?? r.pts) });

        let moveEl;
        if (prevRanks[r.id] == null) {
          moveEl = el("div", { class: "move flat", text: "جديد" });
        } else {
          const diff = prevRanks[r.id] - (i + 1);
          if (diff > 0) moveEl = el("div", { class: "move up", text: "▲" + diff });
          else if (diff < 0) moveEl = el("div", { class: "move down", text: "▼" + Math.abs(diff) });
          else moveEl = el("div", { class: "move flat", text: "–" });
        }

        board.appendChild(el("div", { class: "row ranking-row", onclick: () => { location.href = "mosque.html?id=" + r.id; } }, [
          el("div", { class: "rank", text: String(i + 1) }),
          moveEl,
          el("div", { class: "info" }, [
            el("div", { class: "name" }, [
              m.logo ? el("img", { src: m.logo, alt: "", style: { width: "26px", height: "26px", borderRadius: "8px", objectFit: "cover" } }) : el("span", { class: "dot", style: { background: color } }),
              el("span", { text: m.name || r.id }),
            ]),
            el("div", { class: "bar-wrap" }, [bar]),
            el("div", { class: "meta", text: "فوز " + r.win + " · تعادل " + r.draw + " · خسارة " + r.loss }),
          ]),
          ptsEl,
        ]));

        // عدّ سلس من القيمة السابقة للجديدة
        const from = prevPts[r.id] ?? 0;
        const to = r.pts;
        const start = performance.now();
        const dur = 800;
        const tick = (now) => {
          const k = Math.min(1, (now - start) / dur);
          ptsEl.textContent = String(Math.round(from + (to - from) * k));
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
        setTimeout(() => { bar.style.width = (r.pts / max * 100) + "%"; }, 50);
      });

      // حفظ الترتيب الحالي للمقارنة في المرة الجاية
      const ranks = {};
      const pts = {};
      rows.forEach((r, i) => { ranks[r.id] = i + 1; pts[r.id] = r.pts; });
      localStorage.setItem(snapKey(), JSON.stringify({ ranks, pts }));
    }

    // ---------- نقاط الألعاب (للآدمن) ----------
    function renderPointsForm() {
      const box = $("pointsInputs");
      box.innerHTML = "";
      ["football", "volleyball", "chess"].forEach((type) => {
        const cfg = points[type] || DEFAULT_POINTS[type];
        box.appendChild(el("div", { class: "pts-grid", style: { marginTop: "8px" } }, [
          el("div", { text: TYPE_LABELS[type] }),
          el("input", { type: "number", min: "0", max: "99", value: cfg.win, id: type + "Win", dir: "ltr" }),
          el("input", { type: "number", min: "0", max: "99", value: cfg.draw, id: type + "Draw", dir: "ltr" }),
        ]));
      });
      const sp = points.sprintPlaces || DEFAULT_POINTS.sprintPlaces;
      ["sp1", "sp2", "sp3", "sp4"].forEach((id, i) => { $(id).value = sp[i] ?? 0; });
    }

    $("savePointsBtn").addEventListener("click", async () => {
      $("pointsMsg").className = "msg";
      const out = {};
      for (const type of ["football", "volleyball", "chess"]) {
        const win = Number($(type + "Win").value);
        const draw = Number($(type + "Draw").value);
        if (![win, draw].every((v) => Number.isInteger(v) && v >= 0 && v <= 99)) {
          $("pointsMsg").classList.add("err");
          $("pointsMsg").textContent = "النقاط لازم تكون أرقام بين 0 و99";
          return;
        }
        out[type] = { win, draw, loss: 0 };
      }
      const sprintPlaces = ["sp1", "sp2", "sp3", "sp4"].map((id) => Number($(id).value));
      if (!sprintPlaces.every((v) => Number.isInteger(v) && v >= 0 && v <= 99)) {
        $("pointsMsg").classList.add("err");
        $("pointsMsg").textContent = "نقاط الضاحية لازم تكون أرقام بين 0 و99";
        return;
      }
      out.sprintPlaces = sprintPlaces;
      try {
        await setDoc(doc(db, "settings", "points"), { ...out, updatedAt: serverTimestamp() }, { merge: true });
        points = { ...DEFAULT_POINTS, ...out };
        $("pointsMsg").classList.add("ok");
        $("pointsMsg").textContent = "تم حفظ النقاط";
        renderBoard();
      } catch (e) {
        $("pointsMsg").classList.add("err");
        $("pointsMsg").textContent = (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ");
      }
    });
  </script>
</body>
</html>
