<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>إدارة الألعاب</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">إدارة الألعاب</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="card">
      <h2 id="formTitle">إضافة لعبة</h2>
      <form id="gameForm" autocomplete="off" onsubmit="return false;">
        <label for="name">اسم اللعبة</label>
        <input id="name" required maxlength="60">

        <label for="type">نوع اللعبة</label>
        <select id="type">
          <option value="football">كرة القدم</option>
          <option value="volleyball">الطائرة</option>
          <option value="chess">الشطرنج</option>
          <option value="sprint">الضاحية</option>
        </select>

        <label for="maxPlayers">الحد الأقصى للطلاب بالمسجد</label>
        <input id="maxPlayers" type="number" min="1" max="99" required dir="ltr">

        <div class="row">
          <button id="saveBtn" type="button">حفظ</button>
          <button id="cancelBtn" type="button" class="ghost hidden">إلغاء التعديل</button>
        </div>
        <p id="formErr" class="err" role="alert"></p>
      </form>
    </section>

    <section class="card">
      <h2>الألعاب</h2>
      <div id="list"><p class="empty">جاري التحميل...</p></div>
    </section>
  </main>

  <nav class="tabbar">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="mosques.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="games.html" class="active"><span class="ic">🎯</span>الألعاب</a>
    <a href="accounts.html" class=""><span class="ic">👤</span>الحسابات</a>
    <a href="tools.html" class=""><span class="ic">🛠️</span>الأدوات</a>
    <a href="log.html" class=""><span class="ic">🧾</span>السجل</a>
  </nav>

  <script type="module">
    import { auth, db, ROLE_LABELS } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    const TYPE_LABELS = { football: "كرة القدم", volleyball: "الطائرة", chess: "الشطرنج", sprint: "الضاحية" };
    let me = null;
    let editingId = null;

    // ---------- حماية الصفحة: للآدمن فقط ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("index.html");
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;
      if (!p || p.role !== "admin" || p.disabled || p.deleted || p.mustChange) {
        return location.replace("app.html");
      }
      me = { uid: user.uid, ...p };
      await loadGames();
    });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    const errText = (e) => (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ، حاول مرة ثانية");

    async function audit(action, targetId, details = {}) {
      await addDoc(collection(db, "auditLog"), {
        actorUid: me.uid, action, targetId: targetId || null, details, at: serverTimestamp(),
      });
    }

    // ---------- قائمة الألعاب ----------
    async function loadGames() {
      const snap = await getDocs(query(collection(db, "games"), orderBy("name")));
      const list = $("list");
      list.innerHTML = "";
      if (snap.empty) {
        list.appendChild(el("p", { class: "empty", text: "ما في ألعاب بعد" }));
        return;
      }
      snap.docs.forEach((d) => list.appendChild(renderGame(d.id, d.data())));
    }

    function renderGame(id, g) {
      const archived = !!g.archived;
      const badge = el("span", { class: "badge" + (archived ? " off" : ""), text: archived ? "مخفية" : "ظاهرة" });
      const head = el("div", { class: "item-head" }, [
        el("div", {}, [
          el("div", { class: "item-name", text: g.name || "-" }),
          el("div", { class: "item-meta", text: (TYPE_LABELS[g.type] || g.type || "-") + " · الحد: " + (g.maxPlayers ?? "-") + " طالب" }),
        ]),
        badge,
      ]);
      const actions = el("div", { class: "row" }, [
        el("button", { class: "ghost", type: "button", text: "تعديل", onclick: () => startEdit(id, g) }),
        el("button", { class: "ghost", type: "button", text: archived ? "إظهار" : "إخفاء", onclick: () => toggleArchive(id, g, !archived) }),
        el("button", { class: "danger", type: "button", text: "حذف نهائي", onclick: () => removeGame(id, g) }),
      ]);
      return el("div", { class: "item" }, [head, actions]);
    }

    // ---------- الفورم ----------
    function resetForm() {
      editingId = null;
      $("gameForm").reset();
      $("formTitle").textContent = "إضافة لعبة";
      $("saveBtn").textContent = "حفظ";
      $("cancelBtn").classList.add("hidden");
      $("formErr").textContent = "";
    }
    $("cancelBtn").addEventListener("click", resetForm);

    function startEdit(id, g) {
      editingId = id;
      $("name").value = g.name || "";
      $("type").value = g.type || "football";
      $("maxPlayers").value = g.maxPlayers ?? "";
      $("formTitle").textContent = "تعديل: " + (g.name || "");
      $("saveBtn").textContent = "حفظ التعديل";
      $("cancelBtn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function readPayload() {
      const name = $("name").value.trim();
      const type = $("type").value;
      const maxPlayers = Number($("maxPlayers").value);
      if (name.length < 2 || name.length > 60) throw new Error("اسم اللعبة لازم يكون بين 2 و60 حرف");
      if (!TYPE_LABELS[type]) throw new Error("نوع اللعبة غير صحيح");
      if (!Number.isInteger(maxPlayers) || maxPlayers < 1 || maxPlayers > 99) {
        throw new Error("الحد الأقصى لازم يكون رقم بين 1 و99");
      }
      return { name, type, maxPlayers };
    }

    $("saveBtn").addEventListener("click", async () => {
      const btn = $("saveBtn");
      btn.disabled = true;
      $("formErr").textContent = "";
      try {
        const payload = readPayload();
        if (editingId) {
          await updateDoc(doc(db, "games", editingId), { ...payload, updatedAt: serverTimestamp() });
          await audit("game.update", editingId, payload);
        } else {
          const ref = await addDoc(collection(db, "games"), {
            ...payload, archived: false, isTest: false,
            createdAt: serverTimestamp(), createdBy: me.uid,
          });
          await audit("game.create", ref.id, payload);
        }
        resetForm();
        await loadGames();
      } catch (e) {
        $("formErr").textContent = errText(e);
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- الإخفاء والحذف ----------
    async function toggleArchive(id, g, archived) {
      const msg = archived ? "إخفاء اللعبة؟ بياناتها تبقى محفوظة." : "إظهار اللعبة من جديد؟";
      if (!confirm(msg)) return;
      try {
        await updateDoc(doc(db, "games", id), { archived, updatedAt: serverTimestamp() });
        await audit(archived ? "game.archive" : "game.unarchive", id, { name: g.name || "" });
        await loadGames();
      } catch (e) {
        alert(errText(e));
      }
    }

    async function removeGame(id, g) {
      if (!confirm("حذف اللعبة (" + (g.name || "") + ") نهائياً؟ ما يرجع بعدها.")) return;
      try {
        await deleteDoc(doc(db, "games", id));
        await audit("game.delete", id, { name: g.name || "" });
        await loadGames();
      } catch (e) {
        alert(errText(e));
      }
    }
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
