<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>الأخبار</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">الأخبار</div><a class="btn ghost" href="app.html">الرئيسية</a></div>

  <main class="wrap">
    <section class="hero" data-page-hero style="margin:14px 0 16px;padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fffdf6;border:1px solid rgba(226,189,117,.25)"><span class="eyebrow" style="color:#f3dfb2">أولمبياد المساجد</span><h1 style="margin:4px 0 4px;font-size:24px;font-weight:900">الأخبار</h1><p style="margin:0;opacity:.82;font-size:13px">آخر ما يحدث في أولمبياد المساجد</p></section>
    <section class="card hidden" id="formCard">
      <h2 id="formTitle">خبر جديد</h2>
      <form id="newsForm" autocomplete="off" onsubmit="return false;">
        <label for="title">العنوان</label>
        <input id="title" maxlength="120">
        <label for="body">نص الخبر</label>
        <textarea id="body" maxlength="5000"></textarea>
        <div class="row">
          <button id="saveBtn" type="button">نشر</button>
          <button id="cancelBtn" type="button" class="ghost hidden">إلغاء التعديل</button>
        </div>
        <p id="formErr" class="err" role="alert"></p>
      </form>
    </section>

    <section class="card">
      <h2>آخر الأخبار</h2>
      <div id="list"><p class="empty">جاري التحميل...</p></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="matches-public.html" class=""><span class="ic">⚽</span>المباريات</a>
    <a href="ranking.html" class=""><span class="ic">🏆</span>الترتيب</a>
    <a href="mosques-public.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="news.html" class="active"><span class="ic">📰</span>الأخبار</a>
  </nav>
  <script type="module">
    import { auth, db, tf, hasPerm } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let me = null;
    let editingId = null;

    onAuthStateChanged(auth, async (user) => {
      me = null;
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const p = snap.exists() ? snap.data() : null;
        if (p && !p.disabled && !p.deleted && !p.mustChange && hasPerm(p, "news")) {
          me = { uid: user.uid, ...p };
        }
      }
      $("formCard").classList.toggle("hidden", !me);
      await loadNews();
    });

    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => {
        if (k === "class") node.className = v;
        else if (k === "text") node.textContent = v;
        else node[k] = v;
      });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    const errText = (e) => (e?.code ? "[" + e.code + "] " : "") + (e?.message || "صار خطأ، حاول مرة ثانية");

    function fmtDate(ts) {
      if (!ts || !ts.toDate) return "";
      return ts.toDate().toLocaleString("ar", { dateStyle: "medium", timeStyle: "short" });
    }

    async function loadNews() {
      const snap = await getDocs(query(collection(db, "news"), ...tf()));
      const items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      items.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      const list = $("list");
      list.innerHTML = "";
      if (!items.length) {
        list.appendChild(el("p", { class: "empty", text: "ما في أخبار بعد" }));
        return;
      }
      items.forEach((n) => {
        const kids = [
          el("div", { class: "news-title", text: n.title || "-" }),
          el("div", { class: "news-date", text: fmtDate(n.createdAt) + (n.authorName ? " · " + n.authorName : "") }),
          el("div", { class: "news-body", text: n.body || "" }),
        ];
        if (me) {
          kids.push(el("div", { class: "row" }, [
            el("button", { class: "ghost", type: "button", text: "تعديل", onclick: () => startEdit(n) }),
            el("button", { class: "danger", type: "button", text: "حذف", onclick: () => removeNews(n) }),
          ]));
        }
        list.appendChild(el("div", { class: "news" }, kids));
      });
    }

    function resetForm() {
      editingId = null;
      $("title").value = "";
      $("body").value = "";
      $("formTitle").textContent = "خبر جديد";
      $("saveBtn").textContent = "نشر";
      $("cancelBtn").classList.add("hidden");
      $("formErr").textContent = "";
    }
    $("cancelBtn").addEventListener("click", resetForm);

    function startEdit(n) {
      editingId = n.id;
      $("title").value = n.title || "";
      $("body").value = n.body || "";
      $("formTitle").textContent = "تعديل الخبر";
      $("saveBtn").textContent = "حفظ التعديل";
      $("cancelBtn").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("saveBtn").addEventListener("click", async () => {
      $("formErr").textContent = "";
      const title = $("title").value.trim();
      const body = $("body").value.trim();
      if (title.length < 2) return ($("formErr").textContent = "العنوان لازم يكون حرفين على الأقل");
      if (body.length < 2) return ($("formErr").textContent = "اكتب نص الخبر");
      const btn = $("saveBtn");
      btn.disabled = true;
      try {
        if (editingId) {
          await updateDoc(doc(db, "news", editingId), { title, body, updatedAt: serverTimestamp() });
        } else {
          await addDoc(collection(db, "news"), {
            title, body, isTest: false,
            createdAt: serverTimestamp(), createdBy: me.uid,
            authorName: me.name || "",
          });
        }
        resetForm();
        await loadNews();
      } catch (e) {
        $("formErr").textContent = errText(e);
      } finally {
        btn.disabled = false;
      }
    });

    async function removeNews(n) {
      if (!confirm("حذف هذا الخبر؟")) return;
      try {
        await deleteDoc(doc(db, "news", n.id));
        await loadNews();
      } catch (e) {
        alert(errText(e));
      }
    }
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
