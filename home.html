<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>أولمبياد المساجد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#1E3A8A; --gold:#D4A937; --bg:#F8FAFC; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tajawal, system-ui, sans-serif; background: var(--bg); color: #0F172A; min-height: 100vh; padding-bottom: 84px; }
    header { background: var(--blue); color: #fff; text-align: center; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px 20px; }
    header h1 { margin: 0; font-size: 22px; font-weight: 900; }
    header span { color: var(--gold); }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(30,58,138,.08); margin-bottom: 14px; }
    h2 { margin: 0 0 10px; font-size: 17px; color: var(--blue); }
    .item { border-bottom: 1px solid #E2E8F0; padding: 10px 0; }
    .item:last-child { border-bottom: 0; }
    .teams { font-weight: 900; font-size: 15px; }
    .score { font-size: 20px; font-weight: 900; color: var(--gold); direction: ltr; }
    .meta { color: #475569; font-size: 13px; margin-top: 3px; }
    .countdown { font-size: 26px; font-weight: 900; color: var(--blue); direction: ltr; text-align: center; }
    .top3 { display: flex; gap: 10px; }
    .top3 > div { flex: 1; text-align: center; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 10px 6px; }
    .top3 b { display: block; font-size: 20px; color: var(--gold); }
    .news-title { font-weight: 900; font-size: 15px; }
    .news-body { color: #334155; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
    .empty { color: #64748B; text-align: center; padding: 8px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
    nav a { text-decoration: none; color: var(--blue); font-weight: 700; font-size: 12px; text-align: center; min-width: 56px; padding: 6px; }
  </style>
</head>
<body>
  <header><h1>أولمبياد <span>المساجد</span></h1></header>

  <main>
    <section class="card"><h2>مباريات اليوم</h2><div id="today"><p class="empty">جاري التحميل...</p></div></section>
    <section class="card"><h2>المباراة الجاية</h2><div id="next"><p class="empty">جاري التحميل...</p></div></section>
    <section class="card"><h2>أول 3 مساجد</h2><div id="top3" class="top3"><p class="empty">جاري التحميل...</p></div></section>
    <section class="card"><h2>آخر الأخبار</h2><div id="news"><p class="empty">جاري التحميل...</p></div></section>
  </main>

  <nav>
    <a href="home.html">الرئيسية</a>
    <a href="matches-public.html">المباريات</a>
    <a href="ranking.html">الترتيب</a>
    <a href="mosques-public.html">المساجد</a>
    <a href="news.html">الأخبار</a>
    <a href="rules.html">القوانين</a>
    <a href="index.html">دخول</a>
  </nav>

  <script type="module">
    import { db, tf } from "./firebase.js";
    import { collection, doc, getDoc, getDocs, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => { if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else if (k === "style") Object.assign(node.style, v); else node[k] = v; });
      children.forEach((c) => node.appendChild(c));
      return node;
    }
    const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const DEF = { win: 3, draw: 1, loss: 0, places: [10, 7, 5, 3] };

    async function load() {
      const [mSnap, gSnap, mtSnap, nSnap, sSnap] = await Promise.all([
        getDocs(query(collection(db, "mosques"), ...tf())),
        getDocs(query(collection(db, "games"), ...tf())),
        getDocs(query(collection(db, "matches"), ...tf())),
        getDocs(query(collection(db, "news"), ...tf())),
        getDoc(doc(db, "settings", "points")),
      ]);
      const mosques = Object.fromEntries(mSnap.docs.map((d) => [d.id, d.data()]));
      const games = Object.fromEntries(gSnap.docs.map((d) => [d.id, d.data()]));
      const all = mtSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const mName = (id) => (mosques[id] || {}).name || "-";
      const today = todayStr();

      // مباريات اليوم
      const todays = all.filter((m) => m.matchDate === today).sort((a, b) => (a.matchTime || "").localeCompare(b.matchTime || ""));
      const tBox = $("today");
      tBox.innerHTML = "";
      if (!todays.length) tBox.appendChild(el("p", { class: "empty", text: "ما في مباريات اليوم" }));
      todays.forEach((m) => tBox.appendChild(el("div", { class: "item" }, [
        el("div", { class: "meta", text: (m.matchTime || "") + " · " + ((games[m.gameId] || {}).name || "") }),
        el("div", { class: "teams", text: m.mosqueA ? mName(m.mosqueA) + " ضد " + mName(m.mosqueB) : "سباق الضاحية" }),
        m.status === "final" ? el("div", { class: "score", text: (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0) }) : el("div", { class: "meta", text: "لم تنتهِ بعد" }),
      ])));

      // المباراة الجاية (أقرب موعد قادم غير النهائية)
      const upcoming = all.filter((m) => m.status !== "final" && m.matchDate && m.matchDate >= today)
        .sort((a, b) => (a.matchDate + (a.matchTime || "")).localeCompare(b.matchDate + (b.matchTime || "")));
      const nBox = $("next");
      nBox.innerHTML = "";
      if (!upcoming.length) {
        nBox.appendChild(el("p", { class: "empty", text: "ما في مباراة قادمة" }));
      } else {
        const nx = upcoming[0];
        const cd = el("div", { class: "countdown", text: "" });
        nBox.appendChild(el("div", { class: "teams", text: nx.mosqueA ? mName(nx.mosqueA) + " ضد " + mName(nx.mosqueB) : "سباق الضاحية" }));
        nBox.appendChild(el("div", { class: "meta", text: nx.matchDate + " · " + (nx.matchTime || "") }));
        nBox.appendChild(cd);
        const target = new Date(nx.matchDate + "T" + (nx.matchTime || "00:00"));
        const tick = () => {
          const diff = target - new Date();
          if (diff <= 0) { cd.textContent = "بدأت الحين"; return; }
          const h = Math.floor(diff / 3600000), mi = Math.floor((diff % 3600000) / 60000), se = Math.floor((diff % 60000) / 1000);
          cd.textContent = String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0") + ":" + String(se).padStart(2, "0");
        };
        tick();
        setInterval(tick, 1000);
      }

      // أول 3 مساجد (حسب النقاط)
      const pts = sSnap.exists() ? { ...DEF, ...sSnap.data() } : DEF;
      const table = {};
      const ensure = (id) => (table[id] ||= { id, pts: 0, win: 0, gd: 0 });
      all.filter((m) => m.status === "final").forEach((m) => {
        const g = games[m.gameId] || {};
        if (g.type === "sprint") {
          (m.details?.ranking || []).forEach((r, i) => { if (r.mosqueId) ensure(r.mosqueId).pts += (pts.sprintPlaces || DEF.places)[i] ?? 1; });
          return;
        }
        if (!m.mosqueA || !m.mosqueB) return;
        const c = pts[g.type] || DEF;
        const a = ensure(m.mosqueA), b = ensure(m.mosqueB);
        if (m.scoreA > m.scoreB) { a.pts += c.win ?? 3; a.win++; b.pts += c.loss ?? 0; }
        else if (m.scoreA < m.scoreB) { b.pts += c.win ?? 3; b.win++; a.pts += c.loss ?? 0; }
        else { a.pts += c.draw ?? 1; b.pts += c.draw ?? 1; }
        a.gd += (m.scoreA || 0) - (m.scoreB || 0); b.gd += (m.scoreB || 0) - (m.scoreA || 0);
      });
      const top = Object.values(table).sort((x, y) => y.pts - x.pts || y.win - x.win || y.gd - x.gd).slice(0, 3);
      const tp = $("top3");
      tp.innerHTML = "";
      if (!top.length) tp.appendChild(el("p", { class: "empty", text: "ما في نتائج بعد" }));
      top.forEach((t, i) => tp.appendChild(el("div", { onclick: () => { location.href = "mosque.html?id=" + t.id; }, style: { cursor: "pointer" } }, [
        el("div", { text: (i + 1) + ". " + (mosques[t.id]?.name || "-") }),
        el("b", { text: String(t.pts) }),
      ])));

      // آخر الأخبار
      const news = nSnap.docs.map((d) => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)).slice(0, 3);
      const nw = $("news");
      nw.innerHTML = "";
      if (!news.length) nw.appendChild(el("p", { class: "empty", text: "ما في أخبار بعد" }));
      news.forEach((n) => nw.appendChild(el("div", { class: "item" }, [
        el("div", { class: "news-title", text: n.title || "-" }),
        el("div", { class: "news-body", text: n.body || "" }),
      ])));
    }
    load().catch(() => { $("today").innerHTML = "<p class='empty'>ما قدرنا نحمّل البيانات الحين</p>"; });
  </script>
  <script type="module" src="maintenance.js"></script>
  <script>(function(){var p=new URLSearchParams(location.search).get("preview");if(!p)return;var d=document.createElement("div");d.setAttribute("style","position:sticky;top:0;z-index:99;background:#D4A937;color:#0F172A;padding:8px 12px;font-weight:700;text-align:center;font-family:Tajawal,system-ui,sans-serif");d.textContent="أنت تعاين كـ: "+({visitor:"زائر",supervisor:"مشرف مسجد",organizer:"منظم"}[p]||p)+" · الآدمن عنده كل الصلاحيات حتى بالمعاينة";document.body.prepend(d);})();</script>
</body>
</html>
