<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>المباريات</title>
  <link rel="icon" href="logo-192.png">
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">المباريات</div><a class="btn ghost" href="app.html">الرئيسية</a></div>
  <main class="wrap" id="list"><p class="empty">جاري التحميل...</p></main>
  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="matches-public.html" class="active"><span class="ic">⚽</span>المباريات</a>
    <a href="ranking.html" class=""><span class="ic">🏆</span>الترتيب</a>
    <a href="mosques-public.html" class=""><span class="ic">🕌</span>المساجد</a>
    <a href="news.html" class=""><span class="ic">📰</span>الأخبار</a>
  </nav>

  <script type="module">
    import { db, tf } from "./firebase.js";
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => { if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node[k] = v; });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    async function load() {
      const [gSnap, mSnap, pSnap, mtSnap] = await Promise.all([
        getDocs(query(collection(db, "games"), ...tf())),
        getDocs(query(collection(db, "mosques"), ...tf())),
        getDocs(query(collection(db, "players"), ...tf())),
        getDocs(query(collection(db, "matches"), ...tf())),
      ]);
      const games = Object.fromEntries(gSnap.docs.map((d) => [d.id, d.data()]));
      const mosques = Object.fromEntries(mSnap.docs.map((d) => [d.id, d.data()]));
      const players = Object.fromEntries(pSnap.docs.map((d) => [d.id, d.data()]));
      const list = $("list");
      list.innerHTML = "";

      const all = mtSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const matches = [...all.filter((m) => m.live && m.status !== "final"), ...all.filter((m) => m.status === "final")];
      if (!matches.length) { list.appendChild(el("p", { class: "empty", text: "ما في مباريات بعد" })); return; }

      matches.forEach((m) => {
        const g = games[m.gameId] || {};
        const isSprint = g.type === "sprint";
        const teams = isSprint ? "سباق الضاحية" : (mosques[m.mosqueA]?.name || "-") + " ضد " + (mosques[m.mosqueB]?.name || "-");
        const isLive = m.live && m.status !== "final";
        const kids = [
          el("div", { class: "game-name", text: (g.name || "") + (isLive ? "  ·  🔴 مباشرة" : "") }),
          el("div", { class: "teams", text: teams }),
        ];
        if (!isSprint) kids.push(el("div", { class: "score", text: (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0) }));
        if (g.type === "football" && m.details?.players) {
          const goals = Object.entries(m.details.players)
            .filter(([, c]) => (c.goals || 0) > 0)
            .map(([pid, c]) => (players[pid]?.name || "-") + " (" + c.goals + ")");
          if (goals.length) kids.push(el("div", { class: "scorers", text: "الهدافين: " + goals.join("، ") }));
        }
        if (isSprint && m.details?.ranking?.length) {
          kids.push(el("div", { class: "scorers", text: "الترتيب: " + m.details.ranking.map((r, i) => (i + 1) + ". " + r.name).join("، ") }));
        }
        if (!isSprint) {
          kids.push(el("button", { class: "ghost", type: "button", text: "شارك النتيجة", onclick: () => shareCard(teams, g.name || "", (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0)) }));
        }
        list.appendChild(el("div", { class: "card" }, kids));
      });
    }

    // بطاقة النتيجة كصورة للمشاركة (واتساب وستوري)
    async function shareCard(teams, game, score) {
      const c = document.createElement("canvas");
      c.width = 1080; c.height = 1080;
      const x = c.getContext("2d");
      x.fillStyle = "#1E3A8A"; x.fillRect(0, 0, 1080, 1080);
      x.fillStyle = "#D4A937"; x.font = "bold 60px Tajawal, sans-serif"; x.textAlign = "center";
      x.fillText("أولمبياد المساجد", 540, 150);
      x.fillStyle = "#ffffff"; x.font = "bold 46px Tajawal, sans-serif";
      x.fillText(game, 540, 260);
      x.font = "bold 58px Tajawal, sans-serif";
      x.fillText(teams, 540, 520);
      x.fillStyle = "#D4A937"; x.font = "bold 180px Tajawal, sans-serif";
      x.fillText(score, 540, 760);
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      const file = new File([blob], "result.png", { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "نتيجة المباراة" }); return; } catch (e) { /* يرجع للتحميل */ }
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "result.png";
      document.body.appendChild(a); a.click(); a.remove();
    }

    import("./live.js").then(({ watchMatches }) => watchMatches(() => load().catch(() => {})));
    load().catch(() => { $("list").innerHTML = ""; $("list").appendChild(el("p", { class: "empty", text: "ما قدرنا نحمّل المباريات الحين" })); });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
