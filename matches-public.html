<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>المباريات</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#1E3A8A; --gold:#D4A937; --bg:#F8FAFC; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tajawal, system-ui, sans-serif; background: var(--bg); color: #0F172A; min-height: 100vh; padding-bottom: 80px; }
    header { background: var(--blue); color: #fff; text-align: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 900; }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 4px 16px rgba(30,58,138,.08); margin-bottom: 14px; }
    .game-name { font-size: 13px; color: var(--blue); font-weight: 700; }
    .teams { font-weight: 900; font-size: 17px; margin-top: 4px; }
    .score { font-size: 28px; font-weight: 900; color: var(--gold); direction: ltr; text-align: center; margin: 6px 0; }
    .scorers { color: #475569; font-size: 14px; line-height: 1.7; }
    .empty { color: #64748B; text-align: center; padding: 16px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #E2E8F0; display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
    nav a { text-decoration: none; color: var(--blue); font-weight: 700; font-size: 13px; text-align: center; min-width: 56px; padding: 6px; }
  </style>
</head>
<body>
  <header><h1>المباريات</h1></header>
  <main id="list"><p class="empty">جاري التحميل...</p></main>
  <nav>
    <a href="home.html">الرئيسية</a>
    <a href="matches-public.html">المباريات</a>
    <a href="ranking.html">الترتيب</a>
    <a href="news.html">الأخبار</a>
    <a href="rules.html">القوانين</a>
    <a href="index.html">دخول</a>
  </nav>

  <script type="module">
    import { db, tf } from "./firebase.js";
    import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.entries(props).forEach(([k, v]) => { if (k === "class") node.className = v; else if (k === "text") node.textContent = v; else node[k] = v; });
      children.forEach((c) => node.appendChild(c));
      return node;
    }

    async function load() {
      const [gSnap, mSnap, pSnap, mtSnap] = await Promise.all([
        getDocs(query(collection(db, "games"), ...tf())),
        getDocs(query(collection(db, "mosques"), ...tf())),
        getDocs(query(collection(db, "players"), ...tf())),
        getDocs(query(collection(db, "matches"), ...tf(), where("status", "==", "final"))),
      ]);
      const games = Object.fromEntries(gSnap.docs.map((d) => [d.id, d.data()]));
      const mosques = Object.fromEntries(mSnap.docs.map((d) => [d.id, d.data()]));
      const players = Object.fromEntries(pSnap.docs.map((d) => [d.id, d.data()]));
      const list = $("list");
      list.innerHTML = "";

      const matches = mtSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!matches.length) { list.appendChild(el("p", { class: "empty", text: "ما في مباريات نهائية بعد" })); return; }

      matches.forEach((m) => {
        const g = games[m.gameId] || {};
        const isSprint = g.type === "sprint";
        const teams = isSprint ? "سباق الضاحية" : (mosques[m.mosqueA]?.name || "-") + " ضد " + (mosques[m.mosqueB]?.name || "-");
        const kids = [
          el("div", { class: "game-name", text: g.name || "" }),
          el("div", { class: "teams", text: teams }),
        ];
        if (!isSprint) kids.push(el("div", { class: "score", text: (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0) }));
        if (g.type === "football" && m.details?.players) {
          const goals = Object.entries(m.details.players)
            .filter(([, c]) => (c.goals || 0) > 0)
            .map(([pid, c]) => (players[pid]?.name || "-") + " (" + c.goals + ")");
          if (goals.length) kids.push(el("div", { class: "scorers", text: "الهدافين: " + goals.join("، ") }));
        }
        if (isSprint && m.details?.ranking?.length) {
          kids.push(el("div", { class: "scorers", text: "الترتيب: " + m.details.ranking.map((r, i) => (i + 1) + ". " + r.name).join("، ") }));
        }
        list.appendChild(el("div", { class: "card" }, kids));
      });
    }
    load().catch(() => { $("list").innerHTML = ""; $("list").appendChild(el("p", { class: "empty", text: "ما قدرنا نحمّل المباريات الحين" })); });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
