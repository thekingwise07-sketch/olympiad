<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>المساجد</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="topbar"><div class="brand">المساجد</div><a class="btn ghost" href="app.html">الرئيسية</a></div>
  <main class="wrap" id="list"><p class="empty">جاري التحميل...</p></main>
  <nav class="tabbar">
    <a href="app.html" class=""><span class="ic">🏠</span>الرئيسية</a>
    <a href="matches-public.html" class=""><span class="ic">⚽</span>المباريات</a>
    <a href="ranking.html" class=""><span class="ic">🏆</span>الترتيب</a>
    <a href="mosques-public.html" class="active"><span class="ic">🕌</span>المساجد</a>
    <a href="news.html" class=""><span class="ic">📰</span>الأخبار</a>
    <a href="rules.html" class=""><span class="ic">📜</span>القوانين</a>
  </nav>
  <script type="module">
    import { db, tf } from "./firebase.js";
    import { collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    const list = document.getElementById("list");
    getDocs(query(collection(db, "mosques"), ...tf())).then((snap) => {
      list.innerHTML = "";
      if (snap.empty) { list.innerHTML = "<p class='empty'>ما في مساجد بعد</p>"; return; }
      snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || "").localeCompare(b.name || "")).forEach((m) => {
        const a = document.createElement("a");
        a.className = "m";
        a.href = "mosque.html?id=" + m.id;
        const logo = document.createElement("div");
        if (m.logo) { const img = document.createElement("img"); img.src = m.logo; img.className = "logo"; img.alt = ""; logo.appendChild(img); }
        else { logo.className = "ph"; logo.style.background = m.color || "#1E3A8A"; }
        const n = document.createElement("div"); n.className = "name"; n.textContent = m.name || "-";
        a.append(logo, n);
        list.appendChild(a);
      });
    }).catch(() => { list.innerHTML = "<p class='empty'>ما قدرنا نحمّل المساجد</p>"; });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
