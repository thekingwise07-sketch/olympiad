<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1E">
  <title>أولمبياد المساجد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script>
    // الوضع الداكن افتراضياً، والمستخدم يقدر يغيّره ويتذكر اختياره
    (function () {
      var t = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <div class="topbar">
    <div class="brand">أولمبياد <span>المساجد</span></div>
    <div style="display:flex;gap:8px">
      <button id="themeBtn" class="iconbtn" type="button" aria-label="تغيير الوضع">🌓</button>
      <button id="authBtn" class="iconbtn" type="button" aria-label="الحساب">👤</button>
    </div>
  </div>

  <main class="wrap">
    <section class="hero">
      <h1 id="greet">أهلاً بك</h1>
      <p id="roleLine">تصفح المباريات والترتيب والأخبار</p>
    </section>

    <section class="card">
      <h2>مباريات اليوم</h2>
      <div id="today"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card">
      <h2>المباراة الجاية</h2>
      <div id="next"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card">
      <h2>أول 3 مساجد</h2>
      <div id="top3" class="grid2"><p class="empty">جاري التحميل...</p></div>
    </section>

    <section class="card" id="myArea">
      <h2 id="myTitle">أدواتي</h2>
      <div id="myLinks" class="grid2"></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <script type="module">
    import { auth, db, tf, ROLE_LABELS } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, doc, getDoc, getDocs, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let role = "visitor";
    let profile = null;

    // ---------- الأدوار: الزائر يشوف الكل، وكل دور يضيف أدواته ----------
    const TABS = {
      visitor: [
        ["🏠", "الرئيسية", "app.html"],
        ["⚽", "المباريات", "matches-public.html"],
        ["🏆", "الترتيب", "ranking.html"],
        ["🕌", "المساجد", "mosques-public.html"],
        ["📰", "الأخبار", "news.html"],
        ["📜", "القوانين", "rules.html"],
      ],
    };
    const EXTRA = {
      mosque_supervisor: [["👥", "طلابي", "students.html"], ["📝", "المباريات", "matches-public.html"]],
      organizer: [["✍️", "مبارياتي", "matches.html"]],
      supervisor: [["📰", "أخبار", "news.html"], ["👥", "الطلاب", "students.html"], ["🧾", "السجل", "log.html"]],
      admin: [["🛠️", "أدوات", "tools.html"], ["👤", "الحسابات", "accounts.html"], ["🕌", "المساجد", "mosques.html"], ["🎯", "الألعاب", "games.html"], ["🧾", "السجل", "log.html"]],
    };
    const ROLE_NAMES = { visitor: "زائر", mosque_supervisor: "مشرف مسجد", organizer: "منظم", supervisor: "مسؤول", admin: "آدمن" };

    function renderTabs() {
      const bar = $("tabbar");
      bar.innerHTML = "";
      const base = [...TABS.visitor];
      const extra = EXTRA[role] || [];
      const items = base.slice(0, 4).concat(extra.slice(0, 1));
      items.forEach(([ic, label, href]) => {
        const a = document.createElement("a");
        a.href = href;
        a.innerHTML = '<span class="ic">' + ic + "</span>" + label;
        if (location.pathname.endsWith(href)) a.classList.add("active");
        bar.appendChild(a);
      });
      const more = document.createElement("a");
      more.href = "#";
      more.innerHTML = '<span class="ic">⋯</span>المزيد';
      more.onclick = (e) => { e.preventDefault(); showMore(); };
      bar.appendChild(more);
    }

    function showMore() {
      const box = $("myLinks");
      const all = [...TABS.visitor.slice(4), ...(EXTRA[role] || [])];
      $("myTitle").textContent = "المزيد";
      box.innerHTML = "";
      all.forEach(([ic, label, href]) => {
        const a = document.createElement("a");
        a.className = "btn ghost";
        a.href = href;
        a.textContent = ic + " " + label;
        box.appendChild(a);
      });
      $("myArea").scrollIntoView({ behavior: "smooth" });
    }

    function renderMyArea() {
      const box = $("myLinks");
      box.innerHTML = "";
      const list = EXTRA[role] || [];
      $("myTitle").textContent = role === "visitor" ? "ادخل لحسابك" : "أدواتي";
      if (role === "visitor") {
        const a = document.createElement("a");
        a.className = "btn";
        a.href = "index.html";
        a.textContent = "تسجيل الدخول";
        box.appendChild(a);
        return;
      }
      list.forEach(([ic, label, href]) => {
        const a = document.createElement("a");
        a.className = "btn ghost";
        a.href = href;
        a.textContent = ic + " " + label;
        box.appendChild(a);
      });
    }

    // ---------- الجلسة والدور ----------
    onAuthStateChanged(auth, async (user) => {
      role = "visitor";
      profile = null;
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const p = snap.exists() ? snap.data() : null;
        if (p && !p.disabled && !p.deleted && !p.mustChange) {
          profile = p;
          role = p.role;
        }
      }
      $("greet").textContent = profile ? "أهلاً " + (profile.name || "") : "أهلاً بك";
      $("roleLine").textContent = profile ? "دورك: " + (ROLE_NAMES[role] || role) : "تصفح المباريات والترتيب والأخبار";
      $("authBtn").textContent = profile ? "⏻" : "👤";
      $("authBtn").onclick = async () => {
        if (profile) { await signOut(auth); location.reload(); }
        else location.href = "index.html";
      };
      renderTabs();
      renderMyArea();
    });

    $("themeBtn").onclick = () => {
      const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", cur);
      localStorage.setItem("theme", cur);
    };

    // ---------- لوحة اليوم (بيانات عامة) ----------
    const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const esc = (t) => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };

    async function loadDashboard() {
      const [mSnap, gSnap, mtSnap] = await Promise.all([
        getDocs(query(collection(db, "mosques"), ...tf())),
        getDocs(query(collection(db, "games"), ...tf())),
        getDocs(query(collection(db, "matches"), ...tf())),
      ]);
      const mosques = Object.fromEntries(mSnap.docs.map((d) => [d.id, d.data()]));
      const games = Object.fromEntries(gSnap.docs.map((d) => [d.id, d.data()]));
      const all = mtSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const mName = (id) => (mosques[id] || {}).name || "-";
      const today = todayStr();

      const todays = all.filter((m) => m.matchDate === today).sort((a, b) => (a.matchTime || "").localeCompare(b.matchTime || ""));
      $("today").innerHTML = todays.length ? todays.map((m) => `
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <span class="chip">${esc(m.matchTime || "")}</span>
          <div style="font-weight:800;margin-top:6px">${esc(m.mosqueA ? mName(m.mosqueA) + " ضد " + mName(m.mosqueB) : "سباق الضاحية")}</div>
          <div class="muted">${esc((games[m.gameId] || {}).name || "")} ${m.status === "final" ? "· " + (m.scoreA ?? 0) + " - " + (m.scoreB ?? 0) : "· لم تنتهِ"}</div>
        </div>`).join("") : '<p class="empty">ما في مباريات اليوم</p>';

      const upcoming = all.filter((m) => m.status !== "final" && m.matchDate && m.matchDate >= today)
        .sort((a, b) => (a.matchDate + (a.matchTime || "")).localeCompare(b.matchDate + (b.matchTime || "")));
      if (!upcoming.length) {
        $("next").innerHTML = '<p class="empty">ما في مباراة قادمة</p>';
      } else {
        const nx = upcoming[0];
        $("next").innerHTML = `<div style="font-weight:800">${esc(nx.mosqueA ? mName(nx.mosqueA) + " ضد " + mName(nx.mosqueB) : "سباق الضاحية")}</div>
          <div class="muted">${esc(nx.matchDate)} · ${esc(nx.matchTime || "")}</div>
          <div id="cd" class="gold" style="font-size:28px;font-weight:900;direction:ltr;text-align:center;margin-top:10px"></div>`;
        const target = new Date(nx.matchDate + "T" + (nx.matchTime || "00:00"));
        const tick = () => {
          const diff = target - new Date();
          const el = document.getElementById("cd");
          if (!el) return;
          if (diff <= 0) { el.textContent = "بدأت الحين"; return; }
          const h = Math.floor(diff / 3600000), mi = Math.floor((diff % 3600000) / 60000), se = Math.floor((diff % 60000) / 1000);
          el.textContent = [h, mi, se].map((x) => String(x).padStart(2, "0")).join(":");
        };
        tick();
        setInterval(tick, 1000);
      }

      const table = {};
      const ensure = (id) => (table[id] ||= { id, pts: 0, win: 0, gd: 0 });
      all.filter((m) => m.status === "final" && m.mosqueA && m.mosqueB).forEach((m) => {
        const c = { win: 3, draw: 1, loss: 0 };
        const a = ensure(m.mosqueA), b = ensure(m.mosqueB);
        if (m.scoreA > m.scoreB) { a.pts += c.win; a.win++; }
        else if (m.scoreA < m.scoreB) { b.pts += c.win; b.win++; }
        else { a.pts += c.draw; b.pts += c.draw; }
        a.gd += (m.scoreA || 0) - (m.scoreB || 0); b.gd += (m.scoreB || 0) - (m.scoreA || 0);
      });
      const top = Object.values(table).sort((x, y) => y.pts - x.pts || y.win - x.win || y.gd - x.gd).slice(0, 3);
      $("top3").innerHTML = top.length ? top.map((t, i) => `
        <a href="mosque.html?id=${esc(t.id)}" class="card" style="margin:0;text-decoration:none;color:var(--text);text-align:center">
          <div class="muted">#${i + 1}</div>
          <div style="font-weight:800;margin:4px 0">${esc(mosques[t.id]?.name || "-")}</div>
          <div class="gold" style="font-size:22px;font-weight:900">${t.pts}</div>
        </a>`).join("") : '<p class="empty">ما في نتائج بعد</p>';
    }

    loadDashboard().catch(() => { $("today").innerHTML = '<p class="empty">ما قدرنا نحمّل البيانات الحين</p>'; });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
