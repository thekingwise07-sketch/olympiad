<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A8A">
  <title>أولمبياد المساجد - تسجيل الدخول</title>
  <link rel="stylesheet" href="theme.css">
  <script>(function(){document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")||"dark");})();</script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div style="text-align:center;padding:26px 10px 8px">
      <div style="width:72px;height:72px;margin:0 auto 14px;display:grid;place-items:center;border-radius:22px;background:linear-gradient(145deg,#28764e,#143a2b);color:#f3dfb2;border:1px solid rgba(226,189,117,.5);font-size:30px;font-weight:900;box-shadow:0 12px 30px rgba(20,58,43,.3)">م</div>
      <h1 style="margin:0;font-size:26px;font-weight:900">أولمبياد <span class="gold">المساجد</span></h1>
      <p class="muted" style="margin:6px 0 0">سجّل دخولك لإدارة حسابك أو تابع كزائر</p>
    </div>

  <main class="wrap" style="max-width:440px;margin:0 auto;padding-top:8px">
    <section class="card" id="loginStep" style="margin-top:12px">
      <h2>تسجيل الدخول</h2>
      <p class="hint">ادخل باليوزر وكلمة السر اللي عطاك إياها الآدمن.</p>
      <form id="loginForm">
        <label for="username">اليوزر</label>
        <input id="username" autocomplete="username" required dir="ltr" autocapitalize="none">
        <label for="password">كلمة السر</label>
        <input id="password" type="password" autocomplete="current-password" required dir="ltr">
        <button id="loginBtn" type="submit">دخول</button>
        <p id="loginErr" class="err" role="alert"></p>
      </form>
      <a href="app.html" class="btn ghost" style="width:100%;margin-top:12px;text-align:center">متابعة كزائر</a>
    </section>

    <section class="card hidden" id="changeStep">
      <h2>أول دخول: غيّر كلمة السر</h2>
      <p class="hint">كلمة السر المؤقتة لازم تتغيّر قبل ما تكمل. لا تقل عن 8 أحرف.</p>
      <form id="changeForm" autocomplete="off">
        <label for="newPw">كلمة السر الجديدة</label>
        <input id="newPw" type="password" minlength="8" required dir="ltr" autocomplete="new-password">
        <label for="newPw2">أعد كتابة كلمة السر</label>
        <input id="newPw2" type="password" minlength="8" required dir="ltr" autocomplete="new-password">
        <button id="changeBtn" type="submit">حفظ والدخول</button>
        <p id="changeErr" class="err" role="alert"></p>
      </form>
    </section>
  </main>

  <script type="module">
    import { auth, db, usernameToEmail } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      updatePassword,
      signOut,
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);

    const ERRORS = {
      "auth/invalid-credential": "اليوزر أو كلمة السر غلط",
      "auth/invalid-email": "اليوزر غلط",
      "auth/user-disabled": "هذا الحساب معطّل، كلّم الآدمن",
      "auth/too-many-requests": "محاولات كثيرة، جرّب بعد شوي",
      "auth/network-request-failed": "ما في اتصال بالإنترنت",
      "auth/weak-password": "كلمة السر ضعيفة، لازم 8 أحرف على الأقل",
      "auth/requires-recent-login": "سجّل دخولك من جديد وحاول مرة ثانية",
    };
    const errorText = (e) => ERRORS[e?.code] || "صار خطأ، حاول مرة ثانية";

    function showChangeStep() {
      $("loginStep").classList.add("hidden");
      $("changeStep").classList.remove("hidden");
    }

    async function routeUser(user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      const p = snap.exists() ? snap.data() : null;

      if (!p || p.disabled || p.deleted) {
        await signOut(auth);
        $("loginErr").textContent = !p
          ? "الحساب ما له ملف، كلّم الآدمن"
          : "هذا الحساب معطّل، كلّم الآدمن";
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = "دخول";
        return;
      }
      if (p.mustChange) {
        showChangeStep();
        return;
      }
      location.replace("app.html");
    }

    // جلسة محفوظة من قبل
    onAuthStateChanged(auth, (user) => {
      if (user) routeUser(user).catch((e) => { $("loginErr").textContent = "ما قدرنا نتحقق من الحساب: " + (e.code || e.message); $("loginBtn").disabled = false; $("loginBtn").textContent = "دخول"; });
    });

    $("loginForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("loginBtn").disabled = true;
      $("loginBtn").textContent = "جاري الدخول...";
      $("loginErr").textContent = "";
      try {
        const username = $("username").value.trim().toLowerCase();
        await signInWithEmailAndPassword(auth, usernameToEmail(username), $("password").value);
        // onAuthStateChanged يتولى التوجيه
      } catch (e) {
        $("loginErr").textContent = errorText(e);
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = "دخول";
      }
    });

    $("changeForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const p1 = $("newPw").value;
      const p2 = $("newPw2").value;
      $("changeErr").textContent = "";

      if (p1 !== p2) return ($("changeErr").textContent = "كلمتا السر ما بتتطابقوا");
      if (p1.length < 8) return ($("changeErr").textContent = "لازم 8 أحرف على الأقل");

      $("changeBtn").disabled = true;
      try {
        await updatePassword(auth.currentUser, p1);
        await updateDoc(doc(db, "users", auth.currentUser.uid), { mustChange: false });
        location.replace("app.html");
      } catch (e) {
        $("changeErr").textContent = errorText(e);
        $("changeBtn").disabled = false;
      }
    });
  </script>
  <script type="module" src="maintenance.js"></script>
</body>
</html>
